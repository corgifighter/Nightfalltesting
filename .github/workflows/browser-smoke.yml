name: Verify live Hearthmere browser render
# Runtime parser diagnostics enabled

on:
  workflow_run:
    workflows: ["Deploy Hearthmere to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  browser-smoke:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_commit.message != 'Capture live Hearthmere browser frame' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse runtime JavaScript before browser launch
        run: node --check app.js

      - name: Render the live GitHub Pages game
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-dev-shm-usage',
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader'
              ]
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 900 }, deviceScaleFactor: 1 });
            const errors = [];
            const failedRequests = [];
            page.on('requestfailed', r => failedRequests.push(r.url() + ' :: ' + (r.failure()?.errorText || 'failed')));
            page.on('response', r => { if (r.status() >= 400) failedRequests.push(r.status() + ' ' + r.url()); });
            page.on('pageerror', e => errors.push('pageerror: ' + e.message + (e.stack ? ' :: ' + e.stack : '')));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
            const smokeUrl = 'https://corgifighter.github.io/Nightfalltesting/?browser-smoke=1&capture=1&build=' + process.env.GITHUB_SHA;
            // Pages' dynamic deployment can lag behind the source workflow completion.
            // Wait for the actual deployed asset set before booting the game, otherwise
            // a perfectly good build can be falsely judged as an asset failure.
            const assetGate = new URL('https://raw.githubusercontent.com/corgifighter/Test-screen/main/hero.glb');
            let assetReady = false;
            for (let attempt = 0; attempt < 4; attempt++) {
              try {
                const probe = await page.request.get(assetGate.href, { timeout: 10000 });
                if (probe.ok()) { assetReady = true; break; }
              } catch (_) {}
              await new Promise(r => setTimeout(r, 2500));
            }
            if (!assetReady) throw new Error('GitHub Pages asset gate did not become ready before browser launch: ' + assetGate.href);
            let navigationError = null;
            try {
              await page.goto(smokeUrl, {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
            } catch (e) {
              navigationError = String(e);
              console.log('PAGE_NAVIGATION_ERROR=' + navigationError);
            }
            await page.waitForTimeout(8000);
            await page.waitForFunction(() => window.__HEARTHMERE_READY === true, { timeout: 30000 }).catch(() => {});
            const status = await page.locator('#boot-status').textContent().catch(() => '');
            const canvasCount = await page.locator('#scene canvas').count();
            const webglSupport = await page.evaluate(() => {
              const c = document.createElement('canvas');
              const gl2 = c.getContext('webgl2');
              const gl1 = c.getContext('webgl') || c.getContext('experimental-webgl');
              return {
                webgl2: !!gl2,
                webgl1: !!gl1,
                renderer: gl2?.getParameter(gl2.RENDERER) || gl1?.getParameter(gl1.RENDERER) || null,
                vendor: gl2?.getParameter(gl2.VENDOR) || gl1?.getParameter(gl1.VENDOR) || null
              };
            });
            const bodySnapshot = await page.locator('body').innerText().catch(() => '');
            const resourceSnapshot = await page.evaluate(() => performance.getEntriesByType('resource').map(r => r.name).filter(n => /app\\.js|three|postprocessing|shader/i.test(n)).slice(-80));
            let canvasData = null;
            if (canvasCount > 0) {
              try {
                canvasData = await page.locator('#scene canvas').first().evaluate(canvas => canvas.toDataURL('image/png'), { timeout: 3000 });
                require('fs').writeFileSync('hearthmere-live-canvas.png', Buffer.from(canvasData.split(',')[1], 'base64'));
              } catch (e) {
                console.log('CANVAS_CAPTURE_ERROR=' + String(e));
              }
            }
            const coreAssetBase = 'https://raw.githubusercontent.com/corgifighter/Test-screen/main/';
            const assetChecks = await Promise.all(['hero.glb','character.glb','inn.glb','forge.glb','chapel.glb','mill.glb','watchtower.glb','grass.png','cobble.png','roof.png'].map(async name => {
              const u = coreAssetBase + name;
              const res = await page.request.get(u);
              return { name, status: res.status() };
            }));
            require('fs').writeFileSync(
              'hearthmere-browser-check.txt',
              JSON.stringify({ canvasCount, status, errors, failedRequests, assetChecks, webglSupport, bodySnapshot, resourceSnapshot, dependencyProbe, liveAppParse }, null, 2)
            );
            console.log(JSON.stringify({ canvasCount, status, errors, failedRequests, assetChecks, webglSupport, bodySnapshot, resourceSnapshot, dependencyProbe, navigationError }, null, 2));
            if (canvasCount < 1) {
              if (!webglSupport.webgl1 && !webglSupport.webgl2) throw new Error('Browser smoke environment has no WebGL context; renderer could not create its canvas.');
              throw new Error('WebGL is available but Hearthmere did not create a Three.js canvas. Inspect errors and failedRequests above.');
            }
            if (status && status.startsWith('Runtime error:')) throw new Error(status);
            if (errors.some(e => /THREE|WebGL|GLTF|failed|error/i.test(e))) {
              throw new Error('Browser console/runtime errors detected: ' + errors.join(' | '));
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearthmere-browser-smoke-diagnostics
          path: |
            hearthmere-live-canvas.png
            hearthmere-browser-check.txt

      - name: Commit verified real browser frame
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hearthmere Render Bot"
          git config user.email "actions@github.com"
          git add hearthmere-live-canvas.png hearthmere-browser-check.txt
          git commit -m "Capture live Hearthmere browser frame" || exit 0
          git push origin main
