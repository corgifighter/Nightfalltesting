name: Deploy Hearthmere to GitHub Pages

on:
  push:
    branches: ["main","bisect-200"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the real Hearthmere assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/test-screen
          # Pull the reference asset repository as one archive rather than issuing
          # hundreds of raw-file requests. This avoids raw.githubusercontent.com
          # rate limits and makes the Pages build deterministic.
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/corgifighter/Test-screen/archive/refs/heads/main.tar.gz" \
            -o /tmp/test-screen.tar.gz
          tar -xzf /tmp/test-screen.tar.gz -C /tmp/test-screen --strip-components=1
          find /tmp/test-screen -type f \( -name '*.glb' -o -name '*.png' -o -name '*.jpg' \) -print0 |
            while IFS= read -r -d '' file; do
              rel="${file#/tmp/test-screen/}"
              mkdir -p "assets/$(dirname "$rel")"
              cp "$file" "assets/$rel"
            done
          test -f assets/hero.glb
          test -f assets/character.glb
          test -f assets/inn.glb
          test -f assets/grass.png
          test -f assets/cobble.png
          test -f assets/roof.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
