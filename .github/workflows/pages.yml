name: Deploy Hearthmere to GitHub Pages

on:
  push:
    branches: ["main", "render-lab-modern-2026-09-25"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: render-lab-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the real Hearthmere assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/test-screen
          # Pull the reference asset repository as one archive rather than issuing
          # hundreds of raw-file requests. This avoids raw.githubusercontent.com
          # rate limits and makes the Pages build deterministic.
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/corgifighter/Test-screen/archive/refs/heads/main.tar.gz" \
            -o /tmp/test-screen.tar.gz
          tar -xzf /tmp/test-screen.tar.gz -C /tmp/test-screen --strip-components=1
          find /tmp/test-screen -type f \( -name '*.glb' -o -name '*.png' -o -name '*.jpg' \) -print0 |
            while IFS= read -r -d '' file; do
              rel="${file#/tmp/test-screen/}"
              mkdir -p "assets/$(dirname "$rel")"
              cp "$file" "assets/$rel"
            done
          test -f assets/hero.glb
          test -f assets/character.glb
          test -f assets/inn.glb
          test -f assets/grass.png
          test -f assets/cobble.png
          test -f assets/roof.png


      - name: Prepare the published shell
        if: github.ref_name == 'render-lab-modern-2026-09-25'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          git archive HEAD | tar -x -C site
          cp render-lab.html site/index.html
          # The render-lab source is intentionally self-contained for Pages. Remove
          # the temporary raw-GitHub delivery override and use the exact app.js from
          # this branch, with the same-origin asset tree staged above.
          sed -i '/<base href=/d' site/index.html
          # render-lab.html already uses same-origin app.js; preserve its control query.
          cp -R assets site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.ref_name == 'render-lab-modern-2026-09-25' && 'site' || '.' }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
