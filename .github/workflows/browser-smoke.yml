name: Verify live Hearthmere browser render

on:
  workflow_run:
    workflows: ["Deploy Hearthmere to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  browser-smoke:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_commit.message != 'Capture live Hearthmere browser frame' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Render the live GitHub Pages game
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-dev-shm-usage',
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader'
              ]
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 900 }, deviceScaleFactor: 1 });
            const errors = [];
            const failedRequests = [];
            page.on('requestfailed', r => failedRequests.push(r.url() + ' :: ' + (r.failure()?.errorText || 'failed')));
            page.on('response', r => { if (r.status() >= 400) failedRequests.push(r.status() + ' ' + r.url()); });
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
            await page.goto('https://corgifighter.github.io/Nightfalltesting/?browser-smoke=1', {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });
            await page.waitForFunction(() => document.querySelectorAll('#scene canvas').length > 0, null, { timeout: 120000 });
            await page.waitForTimeout(20000);
            const status = await page.locator('#boot-status').textContent().catch(() => '');
            const canvasCount = await page.locator('#scene canvas').count();
            await page.screenshot({ path: 'hearthmere-live-canvas.png', fullPage: false });
            const assetChecks = await Promise.all(['hero.glb','character.glb','inn.glb','forge.glb','chapel.glb','mill.glb','watchtower.glb','grass.png','cobble.png','roof.png'].map(async name => {
              const u = 'https://corgifighter.github.io/Nightfalltesting/assets/' + name;
              const res = await page.request.get(u);
              return { name, status: res.status() };
            }));
            require('fs').writeFileSync(
              'hearthmere-browser-check.txt',
              JSON.stringify({ canvasCount, status, errors, failedRequests, assetChecks }, null, 2)
            );
            console.log(JSON.stringify({ canvasCount, status, errors, failedRequests, assetChecks }, null, 2));
            if (canvasCount < 1) throw new Error('No Three.js canvas was created.');
            if (status && status.startsWith('Runtime error:')) throw new Error(status);
            if (errors.some(e => /THREE|WebGL|GLTF|failed|error/i.test(e))) {
              throw new Error('Browser console/runtime errors detected: ' + errors.join(' | '));
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit verified real browser frame
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hearthmere Render Bot"
          git config user.email "actions@github.com"
          git add hearthmere-live-canvas.png hearthmere-browser-check.txt
          git commit -m "Capture live Hearthmere browser frame" || exit 0
          git push origin main
