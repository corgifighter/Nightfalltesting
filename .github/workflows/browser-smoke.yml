name: Verify live Hearthmere browser render

on:
  workflow_run:
    workflows: ["Deploy Hearthmere to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  browser-smoke:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_commit.message != 'Capture live Hearthmere browser frame' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse runtime JavaScript before browser launch
        run: node --check app.js

      - name: Render the live GitHub Pages game
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-dev-shm-usage',
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader'
              ]
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 900 }, deviceScaleFactor: 1 });
            const errors = [];
            const failedRequests = [];
            page.on('requestfailed', r => failedRequests.push(r.url() + ' :: ' + (r.failure()?.errorText || 'failed')));
            page.on('response', r => { if (r.status() >= 400) failedRequests.push(r.status() + ' ' + r.url()); });
            page.on('pageerror', e => errors.push('pageerror: ' + e.message + (e.stack ? ' :: ' + e.stack : '')));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
            const smokeUrl = 'https://corgifighter.github.io/Nightfalltesting/?browser-smoke=1&capture=1&build=' + process.env.GITHUB_SHA;
            await page.goto(smokeUrl, {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });
            await page.waitForTimeout(15000);
            const status = await page.locator('#boot-status').textContent().catch(() => '');
            const canvasCount = await page.locator('#scene canvas').count();
            const webglSupport = await page.evaluate(() => {
              const c = document.createElement('canvas');
              const gl2 = c.getContext('webgl2');
              const gl1 = c.getContext('webgl') || c.getContext('experimental-webgl');
              return {
                webgl2: !!gl2,
                webgl1: !!gl1,
                renderer: gl2?.getParameter(gl2.RENDERER) || gl1?.getParameter(gl1.RENDERER) || null,
                vendor: gl2?.getParameter(gl2.VENDOR) || gl1?.getParameter(gl1.VENDOR) || null
              };
            });
            const bodySnapshot = await page.locator('body').innerText().catch(() => '');
            const resourceSnapshot = await page.evaluate(() => performance.getEntriesByType('resource').map(r => r.name).filter(n => /app\\.js|three|postprocessing|shader/i.test(n)).slice(-80));
            const appProbe = await page.request.get(new URL('app.js?build=52', page.url()).href).then(async res => ({ status: res.status(), contentType: res.headers()['content-type'] || '', length: (await res.body()).length })).catch(e => ({ error: String(e) }));
            const moduleProbe = await page.evaluate(async () => { try { await import('./app.js?module-probe=' + Date.now()); return { ok:true }; } catch(e) { return { ok:false, name:e?.name, message:e?.message, stack:e?.stack || '' }; } });
            const dependencyProbe = await page.evaluate(async () => { const urls=['https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/controls/OrbitControls.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/loaders/GLTFLoader.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/postprocessing/EffectComposer.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/postprocessing/RenderPass.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/postprocessing/UnrealBloomPass.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/postprocessing/SSAOPass.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/postprocessing/OutputPass.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/postprocessing/FXAAPass.js','https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/postprocessing/ShaderPass.js']; const out=[]; for(const u of urls){try{await import(u);out.push({u,ok:true})}catch(e){out.push({u,ok:false,name:e?.name,message:e?.message})}} return out; });
            let canvasData = null;
            if (canvasCount) {
              canvasData = await page.locator('#scene canvas').evaluate(canvas => canvas.toDataURL('image/png'));
              require('fs').writeFileSync('hearthmere-live-canvas.png', Buffer.from(canvasData.split(',')[1], 'base64'));
            }
            const assetChecks = await Promise.all(['hero.glb','character.glb','inn.glb','forge.glb','chapel.glb','mill.glb','watchtower.glb','grass.png','cobble.png','roof.png'].map(async name => {
              const u = new URL('assets/' + name, page.url()).href;
              const res = await page.request.get(u);
              return { name, status: res.status() };
            }));
            require('fs').writeFileSync(
              'hearthmere-browser-check.txt',
              JSON.stringify({ canvasCount, status, errors, failedRequests, assetChecks, webglSupport, bodySnapshot, resourceSnapshot, appProbe, moduleProbe, dependencyProbe }, null, 2)
            );
            console.log(JSON.stringify({ canvasCount, status, errors, failedRequests, assetChecks, webglSupport, bodySnapshot, resourceSnapshot, appProbe, moduleProbe, dependencyProbe }, null, 2));
            if (canvasCount < 1) {
              if (!webglSupport.webgl1 && !webglSupport.webgl2) throw new Error('Browser smoke environment has no WebGL context; renderer could not create its canvas.');
              throw new Error('WebGL is available but Hearthmere did not create a Three.js canvas. Inspect errors and failedRequests above.');
            }
            if (status && status.startsWith('Runtime error:')) throw new Error(status);
            if (errors.some(e => /THREE|WebGL|GLTF|failed|error/i.test(e))) {
              throw new Error('Browser console/runtime errors detected: ' + errors.join(' | '));
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearthmere-browser-smoke-diagnostics
          path: |
            hearthmere-live-canvas.png
            hearthmere-browser-check.txt

      - name: Commit verified real browser frame
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hearthmere Render Bot"
          git config user.email "actions@github.com"
          git add hearthmere-live-canvas.png hearthmere-browser-check.txt
          git commit -m "Capture live Hearthmere browser frame" || exit 0
          git push origin main
